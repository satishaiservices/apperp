name: Build for cPanel (production branch)

# The cPanel server (old glibc, limited threads) cannot run `next build`.
# This workflow builds the API (dist/) and the web app (.next/) on GitHub and
# appends a commit (source + build output) to the `production` branch.
# The branch only ever fast-forwards, so cPanel > Git Version Control >
# "Update from Remote" + "Deploy HEAD Commit" (runs .cpanel.yml) works.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      API_INTERNAL_URL: https://apperp.yecindia.com/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build API
        working-directory: apps/api
        run: |
          npm ci --include=dev
          npm run build
          test -f dist/main.js
          test -f dist/generated/prisma/client.js

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci --include=dev
          npm run build
          test -f .next/BUILD_ID
          rm -rf .next/cache

      - name: Publish to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f apps/api/dist apps/web/.next
          tree=$(git write-tree)
          parents="-p $GITHUB_SHA"
          if git fetch -q --depth=1 origin production; then
            parents="-p $(git rev-parse FETCH_HEAD) $parents"
          fi
          commit=$(git commit-tree "$tree" $parents -m "build: production artifacts for ${GITHUB_SHA::7}")
          git push origin "$commit:refs/heads/production"
