services:

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: vyhir-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - vyhir-network


  # NestJS API
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
      target: development

    container_name: vyhir-api
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - ../../apps/api:/app
      - api_node_modules:/app/node_modules
      - ../../.env:/app/.env:ro

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - vyhir-network


  # Next.js Web
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      target: development

    container_name: vyhir-web
    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      API_INTERNAL_URL: http://api:3001/api/v1

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ../../apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - vyhir-network


volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  web_next:


networks:
  vyhir-network:
    driver: bridge
