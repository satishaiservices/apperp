name: Build Release Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API Base URL'
        required: false
        default: 'https://apperp.yecindia.com/api'
        type: string

env:
  DEFAULT_API_URL: 'https://apperp.yecindia.com/api'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter Environment Info
        run: flutter doctor -v

      - name: Ensure Android Gradle Wrapper is Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          TARGET_API_URL="${{ github.event.inputs.api_url || env.DEFAULT_API_URL }}"
          echo "Building Release APK with API_URL: $TARGET_API_URL"
          flutter build apk --release --dart-define=API_URL="$TARGET_API_URL"

      - name: Verify Generated Release APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload app-release.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
